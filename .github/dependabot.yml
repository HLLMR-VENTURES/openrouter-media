version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # typescript and @types/node are build-time only (the published package is
    # already-compiled JS + d.ts). Their majors break the build under our
    # current tsconfig with no benefit to consumers — adopt them deliberately,
    # not automatically. Minor/patch (incl. security) updates still flow.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
