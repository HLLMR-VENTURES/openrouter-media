name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Publishing waits for the owner's approval of the `release` environment (v* tags only).
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.21.1 (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@11.21.1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # npm trusted publishing (OIDC): npmjs.com trusts this repository's release.yml in the
      # `release` environment, so no long-lived npm token exists to steal. Provenance is automatic.
      - name: Publish to npm (trusted publishing, with provenance)
        run: npm publish --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
